[Unit]
RequiresMountsFor=/boot/efi

[Service]
# No TimeoutStopSec: OSTree sets 5m per ExecStop, so a value here only shortens it.
# Appended after OSTree's own ExecStop=, so /KERNEL is generated only after a
# staged deployment has finalized successfully.
ExecStop=/usr/libexec/armada/armada-bootimg-finalize
